<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1180" viewBox="0 0 840 590" role="img" aria-label="Принципиальная схема Atari Punk Console на NE556" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>.w{stroke:#16201b;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}.body{fill:#fbfcf8;stroke:#16201b;stroke-width:1.6}.ic{fill:#e2e6de;stroke:#16201b;stroke-width:1.8}.dot{fill:#16201b}text{font-family:"JetBrains Mono",Menlo,Consolas,monospace;font-size:11px;fill:#16201b}.ref{fill:#1d55b4;font-weight:600}.pn{font-size:9.5px;fill:#56625b}.note{fill:#56625b;font-size:10px}.hl{stroke:#1d55b4;stroke-width:2.2}</style><rect width="840" height="590" fill="#ffffff"/>
